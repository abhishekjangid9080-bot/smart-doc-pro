<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>SmartDoc Pro | Rajasthan Exam Photo Resizer & AI Studio</title>
    <meta name="description" content="Rajasthan CET, LDC, REET aur RAS exams ke liye photo resizer. AI se photo ki size (KB/MB) kam karein aur signature crop karein.">
    
    <link rel="icon" type="image/png" href="icon.png?v=2">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <!-- Cropper.js JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .btn-gradient { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); }
        .logo-box { background: linear-gradient(45deg, #2563eb, #7c3aed); position: relative; overflow: hidden; }
        .logo-box::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: rgba(255,255,255,0.1); transform: rotate(45deg); animation: shine 3s infinite; }
        @keyframes shine { 0% { left: -50%; } 100% { left: 150%; } }
        /* Cropper Container fix */
        #imgContainer { width: 100%; max-height: 300px; overflow: hidden; display: flex; justify-content: center; align-items: center; background: #0f172a; border-radius: 1.5rem; }
        #previewImg { max-width: 100%; display: block; }
    </style>
</head>
<body class="pb-24">

    <div class="p-6 max-w-md mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl logo-box flex items-center justify-center text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-800 leading-tight">SmartDoc Pro</h1>
                    <p class="text-[10px] font-bold text-blue-600 tracking-widest uppercase">AI Exam Studio</p>
                </div>
            </div>
            <button id="installBtn" class="hidden bg-white shadow-md p-3 rounded-2xl text-blue-600 font-bold text-xs border border-blue-50">INSTALL</button>
        </div>

        <div class="space-y-4">
            <!-- Upload Box -->
            <div onclick="document.getElementById('fileInput').click()" class="bg-white p-8 rounded-[40px] shadow-sm border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-4 active:scale-95 transition-all cursor-pointer">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                </div>
                <div class="text-center">
                    <p class="font-black text-slate-800">Upload Document / Photo</p>
                    <p class="text-xs text-slate-400 font-semibold">Support JPG, PNG up to 10MB</p>
                </div>
            </div>
            <input type="file" id="fileInput" class="hidden" accept="image/*">

            <!-- Editor Area -->
            <div id="editorArea" class="hidden space-y-4 bg-white p-6 rounded-[40px] shadow-sm border border-slate-100">
                <div id="imgContainer">
                    <img id="previewImg" alt="Preview">
                </div>

                <!-- Controls -->
                <div class="space-y-3 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                    <p class="text-xs font-black text-slate-700">EDIT & ADJUST CONTROLS</p>
                    
                    <div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1">
                            <span>Brightness</span>
                            <span id="brightVal">100%</span>
                        </div>
                        <input type="range" id="brightnessRange" min="50" max="150" value="100" class="w-full accent-blue-600" oninput="updateFilters()">
                    </div>

                    <div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1">
                            <span>Contrast</span>
                            <span id="contrastVal">100%</span>
                        </div>
                        <input type="range" id="contrastRange" min="50" max="150" value="100" class="w-full accent-blue-600" oninput="updateFilters()">
                    </div>

                    <div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1">
                            <span>Target File Size (KB / MB Limit)</span>
                            <span id="sizeVal">200 KB</span>
                        </div>
                        <input type="range" id="sizeRange" min="50" max="5120" value="200" class="w-full accent-blue-600" oninput="updateSizeLabel(this.value)">
                    </div>
                </div>

                <!-- Actions -->
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="processAndSaveImage(false)" class="btn-gradient text-white py-4 rounded-3xl font-black text-xs shadow-lg shadow-blue-200">CROP & COMPRESS</button>
                    <button onclick="processAndSaveImage(true)" class="bg-purple-600 text-white py-4 rounded-3xl font-black text-xs shadow-lg shadow-purple-200">CONVERT TO PDF</button>
                </div>
                <button onclick="resetEditor()" class="w-full bg-slate-100 text-slate-600 py-3 rounded-3xl font-black text-xs">CANCEL</button>
            </div>

            <!-- Vault List -->
            <div class="mt-8">
                <h2 class="text-sm font-black text-slate-800 mb-4 px-2">RECENT VAULT</h2>
                <div id="vaultList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Script Section -->
    <script>
        let cropper = null;
        let db = null;
        let currentFileName = "";

        // IndexedDB Initialization
        const request = indexedDB.open("SmartDocDB", 9);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if(!db.objectStoreNames.contains("vault")) {
                db.createObjectStore("vault", { keyPath: "id", autoIncrement: true });
            }
        };
        request.onsuccess = e => {
            db = e.target.result;
            loadVault();
        };

        // File Selection Listener
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                currentFileName = file.name;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('previewImg');
                    img.src = event.target.result;
                    document.getElementById('editorArea').classList.remove('hidden');
                    
                    if (cropper) {
                        cropper.destroy();
                    }
                    cropper = new Cropper(img, {
                        aspectRatio: NaN,
                        viewMode: 1,
                        autoCropArea: 1
                    });
                    resetSliders();
                };
                reader.readAsDataURL(file);
            }
        });

        function updateFilters() {
            const b = document.getElementById('brightnessRange').value;
            const c = document.getElementById('contrastRange').value;
            document.getElementById('brightVal').innerText = b + '%';
            document.getElementById('contrastVal').innerText = c + '%';
            
            const cropperCanvasImg = document.querySelector('.cropper-view-box img, .cropper-canvas img');
            if(cropperCanvasImg) {
                cropperCanvasImg.style.filter = `brightness(${b}%) contrast(${c}%)`;
            }
        }

        function updateSizeLabel(val) {
            let kb = parseInt(val);
            if (kb >= 1024) {
                let mb = (kb / 1024).toFixed(1);
                document.getElementById('sizeVal').innerText = mb + ' MB';
            } else {
                document.getElementById('sizeVal').innerText = kb + ' KB';
            }
        }

        function resetSliders() {
            document.getElementById('brightnessRange').value = 100;
            document.getElementById('contrastRange').value = 100;
            document.getElementById('sizeRange').value = 200;
            document.getElementById('brightVal').innerText = '100%';
            document.getElementById('contrastVal').innerText = '100%';
            document.getElementById('sizeVal').innerText = '200 KB';
        }

        function processAndSaveImage(isPdf = false) {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas();
            if (!canvas) return;

            const b = document.getElementById('brightnessRange').value;
            const c = document.getElementById('contrastRange').value;
            const targetKB = parseInt(document.getElementById('sizeRange').value);

            // Apply filters onto final canvas
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = canvas.width;
            finalCanvas.height = canvas.height;
            const ctx = finalCanvas.getContext('2d');
            ctx.filter = `brightness(${b}%) contrast(${c}%)`;
            ctx.drawImage(canvas, 0, 0);

            if (isPdf) {
                const { jsPDF } = window.jspdf;
                let quality = 0.95;
                let dataUrl = finalCanvas.toDataURL('image/jpeg', quality);
                
                const pdf = new jsPDF({
                    orientation: finalCanvas.width > finalCanvas.height ? 'l' : 'p',
                    unit: 'px',
                    format: [finalCanvas.width, finalCanvas.height]
                });
                pdf.addImage(dataUrl, 'JPEG', 0, 0, finalCanvas.width, finalCanvas.height);
                
                // PDF Target Size Padding Logic
                let pdfOutput = pdf.output('datauristring');
                let targetBytes = targetKB * 1024;
                let currentBytes = (pdfOutput.length * (3/4));

                if (currentBytes < targetBytes) {
                    let diff = targetBytes - currentBytes;
                    // Add dummy metadata comment inside PDF to match exact target file size
                    let paddingStr = "\n% " + "A".repeat(Math.floor(diff * 0.75)) + " \n";
                    pdf.internal.events.publish('save');
                    // Append padding directly to the output binary
                    let base64Header = pdfOutput.substring(0, pdfOutput.indexOf(',') + 1);
                    let rawBase64 = pdfOutput.substring(pdfOutput.indexOf(',') + 1);
                    let binaryStr = atob(rawBase64) + paddingStr;
                    pdfOutput = base64Header + btoa(binaryStr);
                }

                let baseName = currentFileName.substring(0, currentFileName.lastIndexOf('.')) || 'document';
                saveToVault(pdfOutput, baseName + '.pdf', 'PDF');
            } else {
                // JPG Compression Loop
                let quality = 0.95;
                let dataUrl = finalCanvas.toDataURL('image/jpeg', quality);
                let sizeKB = (dataUrl.length * (3/4)) / 1024;

                if (sizeKB < targetKB) {
                    quality = 1.0;
                    dataUrl = finalCanvas.toDataURL('image/jpeg', quality);
                } else {
                    let low = 0.1, high = 1.0;
                    for(let i = 0; i < 6; i++) {
                        quality = (low + high) / 2;
                        dataUrl = finalCanvas.toDataURL('image/jpeg', quality);
                        sizeKB = (dataUrl.length * (3/4)) / 1024;
                        if(sizeKB > targetKB) {
                            high = quality;
                        } else {
                            low = quality;
                        }
                    }
                }
                saveToVault(dataUrl, currentFileName || 'image.jpg', 'JPG');
            }

            resetEditor();
        }

        function saveToVault(dataUrl, fileName, fileType) {
            if (!db) return;
            const transaction = db.transaction(["vault"], "readwrite");
            const store = transaction.objectStore("vault");
            store.add({ 
                name: fileName, 
                data: dataUrl, 
                type: fileType,
                date: new Date().toLocaleDateString() 
            });
            transaction.oncomplete = () => { loadVault(); };
        }

        function loadVault() {
            if (!db) return;
            const list = document.getElementById('vaultList');
            list.innerHTML = "";
            const store = db.transaction("vault").objectStore("vault");
            store.openCursor(null, 'prev').onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    let item = cursor.value;
                    let sizeBytes = (item.data.length * (3/4));
                    let sizeDisplay = "";
                    if (sizeBytes >= (1024 * 1024)) {
                        sizeDisplay = (sizeBytes / (1024 * 1024)).toFixed(1) + ' MB';
                    } else {
                        sizeDisplay = Math.round(sizeBytes / 1024) + ' KB';
                    }

                    let fileBadge = item.type === 'PDF' ? 'bg-purple-600' : 'bg-blue-600';
                    let previewThumb = item.type === 'PDF' ? 
                        `<div class="w-12 h-12 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-black text-[10px]">PDF</div>` :
                        `<img src="${item.data}" class="w-12 h-12 rounded-xl object-cover">`;

                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-3xl flex justify-between items-center border border-slate-100 shadow-sm">
                            <div class="flex items-center gap-3">
                                ${previewThumb}
                                <div>
                                    <p class="font-black text-slate-700 text-xs truncate max-w-[110px]">${item.name}</p>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[9px] font-bold px-1.5 py-0.5 rounded text-white ${fileBadge}">${item.type || 'JPG'}</span>
                                        <span class="text-[10px] font-bold text-slate-400">${sizeDisplay}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <a href="${item.data}" download="smartdoc_${item.name}" class="bg-slate-900 text-white px-3 py-2 rounded-xl text-[10px] font-black">GET</a>
                                <button onclick="deleteDoc(${item.id})" class="text-slate-300 ml-1">🗑️</button>
                            </div>
                        </div>`;
                    cursor.continue();
                }
            };
        }

        function deleteDoc(id) {
            if (!db) return;
            const transaction = db.transaction(["vault"], "readwrite");
            transaction.objectStore("vault").delete(id).onsuccess = () => loadVault();
        }

        function resetEditor() {
            document.getElementById('editorArea').classList.add('hidden');
            document.getElementById('fileInput').value = "";
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }
    </script>
</body>
</html>
