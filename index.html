<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>SmartDoc Pro | Rajasthan Exam Photo Resizer & AI Studio</title>
    <meta name="description" content="Rajasthan CET, LDC, REET aur RAS exams ke liye photo resizer. AI se photo ki size (KB) kam karein aur signature crop karein. 100% Free and Secure.">
    <meta name="keywords" content="Photo Resizer, Rajasthan CET Photo Size, LDC Exam Image Converter, Signature Crop, KB Kam Karne Wala App, Rajasthan Govt Jobs Photo Tool">
    <meta name="author" content="SmartDoc Pro">
    
    <link rel="icon" type="image/png" href="icon.png?v=2">
    <link rel="apple-touch-icon" href="icon.png?v=2">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .btn-gradient { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); }
        .logo-box { background: linear-gradient(45deg, #2563eb, #7c3aed); position: relative; overflow: hidden; }
        .logo-box::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: rgba(255,255,255,0.1); transform: rotate(45deg); animation: shine 3s infinite; }
        @keyframes shine { 0% { left: -50%; } 100% { left: 150%; } }
    </style>
</head>
<body class="pb-24">

    <div class="p-6 max-w-md mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl logo-box flex items-center justify-center text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </div>
                <div>
                    <h1 class="text-xl font-black text-slate-800 leading-tight">SmartDoc Pro</h1>
                    <p class="text-[10px] font-bold text-blue-600 tracking-widest uppercase">AI Exam Studio</p>
                </div>
            </div>
            <button id="installBtn" class="hidden bg-white shadow-md p-3 rounded-2xl text-blue-600 font-bold text-xs border border-blue-50">INSTALL</button>
        </div>

        <div class="space-y-4">
            <div onclick="document.getElementById('fileInput').click()" class="bg-white p-8 rounded-[40px] shadow-sm border-2 border-dashed border-slate-200 flex flex-col items-center justify-center gap-4 active:scale-95 transition-all cursor-pointer">
                <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center text-blue-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                </div>
                <div class="text-center">
                    <p class="font-black text-slate-800">Upload Document / Photo</p>
                    <p class="text-xs text-slate-400 font-semibold">Support JPG, PNG up to 10MB</p>
                </div>
            </div>
            <input type="file" id="fileInput" class="hidden" accept="image/*">

            <div id="editorArea" class="hidden space-y-4 bg-white p-6 rounded-[40px] shadow-sm border border-slate-100">
                <div class="max-h-64 overflow-hidden rounded-3xl bg-slate-900 flex justify-center">
                    <img id="previewImg" class="max-w-full" style="filter: brightness(1) contrast(1);">
                </div>

                <!-- Edit Controls -->
                <div class="space-y-3 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                    <p class="text-xs font-black text-slate-700">EDIT & ADJUST CONTROLS</p>
                    
                    <div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1">
                            <span>Brightness</span>
                            <span id="brightVal">100%</span>
                        </div>
                        <input type="range" id="brightnessRange" min="50" max="150" value="100" class="w-full accent-blue-600" oninput="updateFilters()">
                    </div>

                    <div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1">
                            <span>Contrast</span>
                            <span id="contrastVal">100%</span>
                        </div>
                        <input type="range" id="contrastRange" min="50" max="150" value="100" class="w-full accent-blue-600" oninput="updateFilters()">
                    </div>

                    <div>
                        <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1">
                            <span>Target File Size (KB Limit)</span>
                            <span id="kbVal">50 KB</span>
                        </div>
                        <input type="range" id="kbRange" min="10" max="500" value="50" class="w-full accent-blue-600" oninput="document.getElementById('kbVal').innerText = this.value + ' KB'">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <button onclick="processAndSaveImage()" class="btn-gradient text-white py-4 rounded-3xl font-black text-xs shadow-lg shadow-blue-200">CROP & COMPRESS</button>
                    <button onclick="resetEditor()" class="bg-slate-100 text-slate-600 py-4 rounded-3xl font-black text-xs">CANCEL</button>
                </div>
            </div>

            <div class="mt-8">
                <h2 class="text-sm font-black text-slate-800 mb-4 px-2">RECENT VAULT</h2>
                <div id="vaultList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 left-6 right-6 bg-white/80 backdrop-blur-xl border border-white/20 shadow-2xl rounded-[32px] p-4 flex justify-around items-center">
        <button class="text-blue-600"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg></button>
        <button onclick="window.location.reload()" class="text-slate-300"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg></button>
        <button onclick="alert('SmartDoc Pro AI v1.1')" class="text-slate-300"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></button>
    </div>

    <script>
        let cropper;
        let db;
        let currentFileName = "";

        // Database Setup
        const request = indexedDB.open("SmartDocDB", 2);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if(!db.objectStoreNames.contains("vault")) {
                db.createObjectStore("vault", { keyPath: "id", autoIncrement: true });
            }
        };
        request.onsuccess = e => { db = e.target.result; loadVault(); };

        // File Selection
        document.getElementById('fileInput').onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                currentFileName = file.name;
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('previewImg');
                    img.src = event.target.result;
                    document.getElementById('editorArea').classList.remove('hidden');
                    if (cropper) cropper.destroy();
                    cropper = new Cropper(img, { aspectRatio: NaN, viewMode: 1 });
                    resetSliders();
                };
                reader.readAsDataURL(file);
            }
        };

        function updateFilters() {
            const b = document.getElementById('brightnessRange').value;
            const c = document.getElementById('contrastRange').value;
            document.getElementById('brightVal').innerText = b + '%';
            document.getElementById('contrastVal').innerText = c + '%';
            
            const cropperCanvasImg = document.querySelector('.cropper-view-box img, .cropper-canvas img');
            if(cropperCanvasImg) {
                cropperCanvasImg.style.filter = `brightness(${b}%) contrast(${c}%)`;
            }
        }

        function resetSliders() {
            document.getElementById('brightnessRange').value = 100;
            document.getElementById('contrastRange').value = 100;
            document.getElementById('kbRange').value = 50;
            document.getElementById('brightVal').innerText = '100%';
            document.getElementById('contrastVal').innerText = '100%';
            document.getElementById('kbVal').innerText = '50 KB';
        }

        function processAndSaveImage() {
            const canvas = cropper.getCroppedCanvas();
            const b = document.getElementById('brightnessRange').value;
            const c = document.getElementById('contrastRange').value;
            const targetKB = parseInt(document.getElementById('kbRange').value);

            // Apply filter on final canvas rendering
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = canvas.width;
            finalCanvas.height = canvas.height;
            const ctx = finalCanvas.getContext('2d');
            ctx.filter = `brightness(${b}%) contrast(${c}%)`;
            ctx.drawImage(canvas, 0, 0);

            // Iterative compression to match target KB roughly
            let quality = 0.9;
            let dataUrl = finalCanvas.toDataURL('image/jpeg', quality);
            
            // Binary search approximation for file size
            let low = 0.05, high = 0.95;
            for(let i=0; i<5; i++) {
                quality = (low + high) / 2;
                dataUrl = finalCanvas.toDataURL('image/jpeg', quality);
                let sizeKB = (dataUrl.length * (3/4)) / 1024;
                if(sizeKB > targetKB) {
                    high = quality;
                } else {
                    low = quality;
                }
            }

            saveToVault(dataUrl);
            resetEditor();
        }

        function saveToVault(dataUrl) {
            const transaction = db.transaction(["vault"], "readwrite");
            transaction.objectStore("vault").add({ name: currentFileName, data: dataUrl, date: new Date().toLocaleDateString() });
            transaction.oncomplete = () => { loadVault(); };
        }

        function loadVault() {
            const list = document.getElementById('vaultList');
            list.innerHTML = "";
            const store = db.transaction("vault").objectStore("vault");
            store.openCursor(null, 'prev').onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    let sizeKB = Math.round((cursor.value.data.length * (3/4)) / 1024);
                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-3xl flex justify-between items-center border border-slate-100 shadow-sm">
                            <div class="flex items-center gap-3">
                                <img src="${cursor.value.data}" class="w-12 h-12 rounded-xl object-cover">
                                <div>
                                    <p class="font-black text-slate-700 text-xs truncate max-w-[120px]">${cursor.value.name}</p>
                                    <p class="text-[10px] font-bold text-blue-600">${sizeKB} KB</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <a href="${cursor.value.data}" download="smartdoc_${cursor.value.name}" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black">GET</a>
                                <button onclick="deleteDoc(${cursor.value.id})" class="text-slate-300 ml-2">🗑️</button>
                            </div>
                        </div>`;
                    cursor.continue();
                }
            };
        }

        function deleteDoc(id) {
            db.transaction(["vault"], "readwrite").objectStore("vault").delete(id).onsuccess = () => loadVault();
        }

        function resetEditor() {
            document.getElementById('editorArea').classList.add('hidden');
            document.getElementById('fileInput').value = "";
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        // PWA Install Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('installBtn').classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }
    </script>
</body>
                                                                                                                                                        </html>
